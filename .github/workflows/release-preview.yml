name: Build MacRemote preview release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix relay test

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Build macOS preview
        run: |
          swift build --package-path macos --configuration release
          bash macos/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent dist/MacRemote.app dist/MacRemote-macOS.zip
          python cli/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-preview
          path: |
            dist/MacRemote-macOS.zip
            dist/MacRemote-CLI.tar
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Build Windows preview
        shell: pwsh
        run: ./windows/build-app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: dist/MacRemote-Windows.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    needs: [relay, macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MacRemote-macOS.zip \
            dist/MacRemote-Windows.zip \
            dist/app-debug.apk \
            --title "MacRemote ${GITHUB_REF_NAME} preview" \
            --notes "Includes the terminal-first macOS CLI archive, optional macOS and Windows app previews, and Android debug APK. The CLI dashboard binds to localhost and preserves local approval for coding-agent tasks. The optional macOS app is ad-hoc signed but not Developer ID signed or notarized, the Windows package is not code-signed, and the Android APK is a debug build. macOS Gatekeeper may block the optional downloaded app. Do not use the preview builds as production releases." \
            --prerelease
